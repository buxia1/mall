server:
  port: 8080

spring:
  application:
    name: mall-admin
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mall:
  security:
    jwt:
      expiration-seconds: 3600
